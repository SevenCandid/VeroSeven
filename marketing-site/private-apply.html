<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeroSeven Digital Challenge - Private Application</title>
    <link rel="icon" type="image/png" href="assets/vero_logo_favicon.png" />
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem;
            background: rgba(8, 18, 35, 0.7);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--color-text-secondary);
            font-weight: 500;
        }
        .form-group input, 
        .form-group textarea, 
        .form-group select {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            color: var(--color-text-primary);
            font-family: inherit;
            transition: border-color var(--transition-fast);
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--color-accent);
        }
        .submit-btn {
            background-color: var(--color-accent);
            color: var(--color-primary);
            border: none;
            padding: 1rem 2rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            transition: opacity var(--transition-fast);
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
        .success-message {
            display: none;
            text-align: center;
            padding: 2rem;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 8px;
            border: 1px solid var(--color-accent);
            color: var(--color-accent);
        }
        @media (max-width: 768px) {
            .form-container {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient min-h-screen">
        <section class="section">
            <div class="container">
                <div class="text-center" style="margin-bottom: 3rem;">
                    <img src="assets/vero_logo1.png" alt="VeroSeven Logo" style="height: 60px; margin-bottom: 1rem;">
                    <br>
                    <div class="badge" style="margin-bottom: 1rem;">Private Invitation</div>
                    <h2>Founding Team Interest Form</h2>
                    <p style="margin: 0 auto;">VeroSeven Digital Challenge. Please complete this form to apply for the founding team.</p>
                </div>
                
                <div class="glass-panel form-container" id="application-form-container">
                    <form id="interest-form">
                        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                            <div class="form-group">
                                <label>Full Name *</label>
                                <input type="text" name="full_name" required>
                            </div>
                            <div class="form-group">
                                <label>Phone Number *</label>
                                <input type="tel" name="phone_number" required>
                            </div>
                        </div>

                        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                            <div class="form-group">
                                <label>Email Address *</label>
                                <input type="email" name="email" required>
                            </div>
                            <div class="form-group">
                                <label>Current Location *</label>
                                <input type="text" name="location" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Current Occupation / Education Status *</label>
                            <input type="text" name="occupation" required>
                        </div>

                        <div class="form-group">
                            <label>Brief Background *</label>
                            <textarea name="background" rows="3" required></textarea>
                        </div>

                        <div class="form-group">
                            <label>Skills and Experience *</label>
                            <textarea name="skills" rows="3" placeholder="What technical or non-technical skills do you bring?" required></textarea>
                        </div>

                        <div class="form-group">
                            <label>Areas of Contribution *</label>
                            <textarea name="areas_of_contribution" rows="2" placeholder="How do you envision contributing to the project?" required></textarea>
                        </div>

                        <div class="form-group">
                            <label>Availability (Hours per week) *</label>
                            <select name="availability" required>
                                <option value="" disabled selected>Select an option</option>
                                <option value="Less than 10 hours">Less than 10 hours</option>
                                <option value="10-20 hours">10-20 hours</option>
                                <option value="20-40 hours">20-40 hours</option>
                                <option value="Full-time">Full-time</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Why do you want to join? (Motivation) *</label>
                            <textarea name="motivation" rows="4" required></textarea>
                        </div>

                        <button type="submit" class="submit-btn" id="submit-btn">Submit Application</button>
                    </form>
                </div>
                
                <div class="success-message" id="success-message">
                    <h3>Application Submitted Successfully</h3>
                    <p style="margin: 0 auto;">Thank you for your interest. Our team will review your application and get back to you shortly.</p>
                </div>
            </div>
        </section>
    </div>

    <script>
        document.getElementById('interest-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.textContent = 'Submitting...';
            btn.disabled = true;

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                // We will hook this up to our Express API shortly
                const response = await fetch('https://veroseven-api.onrender.com/api/applications', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    document.getElementById('application-form-container').style.display = 'none';
                    document.getElementById('success-message').style.display = 'block';
                } else {
                    alert('An error occurred. Please try again.');
                    btn.textContent = 'Submit Application';
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert('Could not connect to the server. Please ensure the backend is running.');
                btn.textContent = 'Submit Application';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
